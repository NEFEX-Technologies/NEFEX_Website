<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Admin Dashboard | NEFEX Technologies</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Styles -->
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background-color: var(--bg-dark, #0f1115);
            color: var(--text-white, #fff);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
        }

        .admin-container {
            max-width: 1000px;
            margin: 50px auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
        }

        .btn-logout {
            background: transparent;
            border: 1px solid #ff4d4d;
            color: #ff4d4d;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #ff4d4d;
            color: white;
        }

        /* Login Screen */
        #login-screen {
            max-width: 400px;
            margin: 100px auto;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            text-align: center;
        }

        #login-screen input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            border-radius: 6px;
            color: white;
            box-sizing: border-box;
        }

        #login-screen button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: #00d4ff;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Dashboard Screen */
        #dashboard-screen {
            display: none;
        }

        .job-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .job-details h3 {
            margin: 0 0 5px;
        }

        .job-details p {
            margin: 0;
            color: #aaa;
            font-size: 0.9em;
        }

        .job-actions button {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
            font-size: 0.9em;
        }

        .btn-edit {
            background: #ffbe0b;
            color: #000;
        }

        .btn-delete {
            background: #ff4d4d;
            color: #fff;
        }

        /* Form Modal */
        #job-form-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #1d1d1f;
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 500px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            box-sizing: border-box;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-save {
            background: #00d4ff;
            color: #000;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .btn-cancel {
            background: transparent;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.5);
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <h2>Admin Login</h2>
        <div id="login-error" style="color: #ff4d4d; display: none; margin-bottom: 10px;"></div>
        <form id="login-form">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>

    <!-- Dashboard Screen -->
    <div id="dashboard-screen" class="admin-container">
        <div class="header-actions">
            <h2>Careers Admin Dashboard</h2>
            <button class="btn-logout" id="logout-btn"><i class="fas fa-sign-out-alt"></i> Logout</button>
        </div>

        <button class="btn-save" id="add-job-btn" style="margin-bottom: 20px;">
            <i class="fas fa-plus"></i> Add New Job
        </button>

        <div id="jobs-list">
            <!-- Jobs will be populated here -->
        </div>
    </div>

    <!-- Job Modal -->
    <div id="job-form-modal">
        <div class="modal-content">
            <h3 id="modal-title">Add Job</h3>
            <form id="job-form">
                <input type="hidden" id="job-id">

                <div class="form-group">
                    <label>Job Title</label>
                    <input type="text" id="job-title" required>
                </div>

                <div class="form-group">
                    <label>Location</label>
                    <input type="text" id="job-location" placeholder="e.g. Remote">
                </div>

                <div class="form-group">
                    <label>Experience</label>
                    <input type="text" id="job-experience" placeholder="e.g. 2-3 Years">
                </div>

                <div class="form-group">
                    <label>Description</label>
                    <textarea id="job-description" rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label>Key Skills (JSON Array Format)</label>
                    <textarea id="job-skills-data" rows="4"
                        placeholder='[{"name": "Core Skills", "skills": ["Skill 1", "Skill 2"]}]'></textarea>
                    <small style="color: #aaa;">Enter skills categories in JSON array format.</small>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select id="job-status">
                        <option value="1">Active</option>
                        <option value="0">Draft / Inactive</option>
                    </select>
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn-cancel" id="cancel-btn">Cancel</button>
                    <button type="submit" class="btn-save">Save Job</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script -->
    <script src="js/admin.js"></script>
</body>

</html>
